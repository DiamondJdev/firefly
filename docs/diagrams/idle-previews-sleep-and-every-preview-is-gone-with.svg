<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" role="img" aria-label="Idle previews sleep, and every preview is gone within 7 days" font-size="13" width="100%" style="max-width:760px;font-family:var(--font-interface,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif)"><title>Idle previews sleep, and every preview is gone within 7 days</title><rect x="0" y="0" width="760" height="336" rx="12" style="fill:var(--background-primary-alt,#ffffff);stroke:var(--background-modifier-border,#d0d7de);stroke-width:1"/><defs><marker id="preview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--text-faint,#8c959f)"/></marker><marker id="preview-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--interactive-accent,#0969da)"/></marker></defs><text x="24" y="32" style="fill:var(--text-normal,#1f2328)" text-anchor="start" font-size="15" font-weight="600">Idle previews sleep, and every preview is gone within 7 days</text><circle cx="40" cy="140" r="7" style="fill:var(--interactive-accent,#0969da)"/><text x="24" y="98" style="fill:var(--text-muted,#57606a)" text-anchor="start" font-size="11.5">PR opened or pushed</text><path d="M48 140H72" fill="none" style="stroke:var(--text-faint,#8c959f)" stroke-width="1.25" marker-end="url(#preview-arrow)"/><rect x="72" y="112" width="128" height="56" rx="8" style="fill:none;stroke:var(--text-faint,#8c959f);stroke-width:1.25"/><text x="136.0" y="136" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-weight="600">Building</text><text x="136.0" y="152" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">image + fresh DB</text><path d="M200 140H264" fill="none" style="stroke:var(--text-faint,#8c959f)" stroke-width="1.25" marker-end="url(#preview-arrow)"/><text x="232" y="132" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">healthy</text><rect x="264" y="112" width="128" height="56" rx="8" style="fill:var(--interactive-accent,#0969da);fill-opacity:.12;stroke:var(--interactive-accent,#0969da);stroke-width:2"/><text x="328.0" y="136" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-weight="600">Running</text><text x="328.0" y="152" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-size="11.5">preview URL live</text><rect x="520" y="112" width="128" height="56" rx="8" style="fill:none;stroke:var(--text-faint,#8c959f);stroke-width:1.25"/><text x="584.0" y="136" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-weight="600">Sleeping</text><text x="584.0" y="152" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">scaled to zero</text><path d="M392 128H520" fill="none" style="stroke:var(--text-faint,#8c959f)" stroke-width="1.25" marker-end="url(#preview-arrow)"/><text x="456" y="120" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">idle</text><path d="M520 152H392" fill="none" style="stroke:var(--text-faint,#8c959f)" stroke-width="1.25" marker-end="url(#preview-arrow)"/><text x="456" y="172" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">request wakes it</text><rect x="392" y="256" width="128" height="56" rx="8" style="fill:var(--text-faint,#8c959f);fill-opacity:.10;stroke:var(--text-faint,#8c959f);stroke-width:1.25"/><text x="456.0" y="280" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-weight="600">Deleted</text><text x="456.0" y="296" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-size="11.5">PVCs removed too</text><path d="M328 168V284H392" fill="none" style="stroke:var(--text-faint,#8c959f)" stroke-width="1.25" marker-end="url(#preview-arrow)"/><path d="M584 168V284H520" fill="none" style="stroke:var(--text-faint,#8c959f)" stroke-width="1.25" marker-end="url(#preview-arrow)"/><text x="336" y="226" style="fill:var(--text-muted,#57606a)" text-anchor="start" font-size="11.5">PR closed</text><text x="336" y="242" style="fill:var(--text-muted,#57606a)" text-anchor="start" font-size="11.5">or 7 days</text><text x="576" y="226" style="fill:var(--text-muted,#57606a)" text-anchor="end" font-size="11.5">PR closed</text><text x="576" y="242" style="fill:var(--text-muted,#57606a)" text-anchor="end" font-size="11.5">or 7 days</text></svg>
