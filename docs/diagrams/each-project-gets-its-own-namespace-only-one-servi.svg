<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" role="img" aria-label="Each project gets its own namespace; only one service is public" font-size="13" width="100%" style="max-width:760px;font-family:var(--font-interface,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif)"><title>Each project gets its own namespace; only one service is public</title><rect x="0" y="0" width="760" height="328" rx="12" style="fill:var(--background-primary-alt,#ffffff);stroke:var(--background-modifier-border,#d0d7de);stroke-width:1"/><defs><marker id="multi-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--text-faint,#8c959f)"/></marker><marker id="multi-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--interactive-accent,#0969da)"/></marker></defs><text x="24" y="32" style="fill:var(--text-normal,#1f2328)" text-anchor="start" font-size="15" font-weight="600">Each project gets its own namespace; only one service is public</text><rect x="176" y="56" width="384" height="248" rx="8" style="fill:none;stroke:var(--text-faint,#8c959f);stroke-width:1.25" stroke-dasharray="4 4"/><text x="192" y="80" style="fill:var(--text-normal,#1f2328)" text-anchor="start" font-size="13" font-weight="600">namespace: my-project</text><rect x="24" y="108" width="120" height="56" rx="8" style="fill:none;stroke:var(--text-faint,#8c959f);stroke-width:1.25"/><text x="84.0" y="132" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-weight="600">Internet</text><text x="84.0" y="148" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">visitors</text><text x="84" y="186" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">my-project.domain</text><rect x="200" y="100" width="160" height="72" rx="8" style="fill:var(--interactiv