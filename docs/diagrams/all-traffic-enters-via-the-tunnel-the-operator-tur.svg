aint,#8c959f);stroke-width:1.25" /><text x="380.0" y="82" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-weight="600">You: CLI + dashboard</text><rect x="536" y="56" width="200" height="44" rx="8" style="fill:none;stroke:var(--text-faint,#8c959f);stroke-width:1.25" /><text x="636.0" y="82" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-weight="600">Site visitors</text><rect x="24" y="136" width="712" height="56" rx="8" style="fill:none;stroke:var(--text-faint,#8c959f);stroke-width:1.25" /><text x="380" y="160" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-weight="600">Cloudflare edge</text><text x="380" y="180" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">DNS · TLS · Access login · Tunnel (no open ports at home)</text><text x="208" y="216" style="fill:var(--text-muted,#57606a)" text-anchor="start" font-size="11.5">API + webhooks</text><text x="568" y="216" style="fill:var(--text-muted,#57606a)" text-anchor="start" font-size="11.5">app traffic</text><rect x="24" y="228" width="712" height="428" rx="8" style="fill:none;stroke:var(--text-faint,#8c959f);stroke-width:1.25" stroke-dasharray="4 4"/><text x="40" y="252" style="fill:var(--text-normal,#1f2328)" text-anchor="start" font-size="15" font-weight="600">k3s cluster</text><rect x="40" y="272" width="320" height="72" rx="8" style="fill:none;stroke:var(--text-faint,#8c959f);stroke-width:1.25" /><text x="200.0" y="296" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-weight="600">TS API + dashboard</text><text x="200.0" y="312" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">Queues builds, stores env vars</text><text x="200.0" y="328" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">Writes App resources</text><rect x="400" y="272" width="320" height="72" rx="8" style="fill:none;stroke:var(--text-faint,#8c959f);stroke-width:1.25" /><text x="560.0" y="296" styl