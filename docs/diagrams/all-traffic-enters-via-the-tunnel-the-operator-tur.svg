ne;stroke:var(--text-faint,#8c959f);stroke-width:1.25" /><text x="200.0" y="504" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-weight="600">BuildKit builders</text><text x="200.0" y="520" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">Desktops cross-compile both architectures</text><text x="200.0" y="536" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">Builder Pi for native arm64 fallback</text><rect x="400" y="480" width="320" height="72" rx="8" style="fill:none;stroke:var(--text-faint,#8c959f);stroke-width:1.25" /><text x="560.0" y="504" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-weight="600">Zot registry</text><text x="560.0" y="520" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">Multi-arch images + build cache</text><text x="560.0" y="536" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">Never leaves the LAN</text><rect x="40" y="584" width="680" height="56" rx="8" style="fill:none;stroke:var(--text-faint,#8c959f);stroke-width:1.25" /><text x="380" y="608" style="fill:var(--text-normal,#1f2328)" text-anchor="middle" font-weight="600">Observability</text><text x="380" y="626" style="fill:var(--text-muted,#57606a)" text-anchor="middle" font-size="11.5">Vector to VictoriaLogs + VictoriaMetrics · Pi temperature and power</text></svg>
